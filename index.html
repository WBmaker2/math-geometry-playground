<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Math Geometry Playground는 입체 전개도·단면·함수 그래프를 직접 조작하며 배우는 수학 수업 도구입니다." />
    <meta name="theme-color" content="#080e1a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Math Geometry Playground — 3D 수학 도형 놀이터</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #080e1a; color: #e9eefc; }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 10px; background: radial-gradient(circle at 50% 42%, #13233d 0%, #080e1a 62%, #03060d 100%); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .boot-title { margin: 0; font-size: 24px; font-weight: 800; }
      .boot-sub { margin: 0; color: #93a5c8; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <p class="boot-title">Math Geometry Playground</p>
      <p class="boot-sub">3D 수학 도형 놀이터를 준비하고 있습니다</p>
    </div>
    <noscript><div style="position: fixed; inset: 0; display: grid; place-content: center; padding: 24px">사용하려면 JavaScript를 허용해야 합니다.</div></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
